name: Hexfield Studio Tests
on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "public/studio/**"
      - "tests/**"
      - ".github/workflows/hexfield-studio-tests.yml"
  pull_request:
    paths:
      - "worker.js"
      - "public/studio/**"
      - "tests/**"
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker security and successive painting requests
        run: node --experimental-default-type=module tests/imagination-worker.test.mjs
      - name: Evolving painting procedures
        run: node --experimental-default-type=module tests/studio-evolution.test.mjs
      - name: Visual novelty and painting comparison
        run: node --experimental-default-type=module tests/studio-vision.test.mjs
