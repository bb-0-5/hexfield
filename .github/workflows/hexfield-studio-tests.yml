name: Hexfield Studio Tests
on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "public/index.html"
      - "public/legacy.html"
      - "public/hexfield-integrations.js"
      - "public/print-handoff.js"
      - "public/studio/**"
      - "tests/**"
      - ".github/workflows/hexfield-studio-tests.yml"
  pull_request:
    paths:
      - "worker.js"
      - "public/index.html"
      - "public/legacy.html"
      - "public/hexfield-integrations.js"
      - "public/print-handoff.js"
      - "public/studio/**"
      - "tests/**"
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker security and successive painting requests
        run: node --experimental-default-type=module tests/imagination-worker.test.mjs
      - name: Australian independent printer handoff leaves Hexfield out of transactions
        run: node --experimental-default-type=module tests/print-handoff.test.mjs
      - name: Evolving painting procedures
        run: node --experimental-default-type=module tests/studio-evolution.test.mjs
      - name: Install Canvas test renderer
        run: npm install --no-save --no-package-lock skia-canvas@3.0.8
      - name: Parse all new unified studio and historic engine modules
        run: |
          node --check public/studio/rule-studio.js
          node --check public/studio/abstraction-loop.js
          node --check public/studio/word-surface.js
          node --check public/studio/legacy-rules.js
          node --check public/app.js
      - name: Verify executable Rule Studio and archive law engine
        run: node --experimental-default-type=module tests/studio-rules.test.mjs
      - name: Verify Build 313 mark application and frame derivation
        run: node --experimental-default-type=module tests/mark-derivation.test.mjs
      - name: Verify Build 314 invented gesture procedures and 24 generations
        run: node --experimental-default-type=module tests/invented-mark-programs.test.mjs
      - name: Verify unified canvas text and stable experimental controls
        run: node --experimental-default-type=module tests/unified-canvas.test.mjs
      - name: Verify Build 316 two-way word scene collision geometry
        run: node --experimental-default-type=module tests/scene-geometry.test.mjs
      - name: Verify 317 persistent object identities, raster reuse and adaptive candidate budgeting
        run: node --experimental-default-type=module tests/object-render-memory.test.mjs
      - name: Verify 318 true dirty-region execution and exact outside-pixel conservation
        run: node --experimental-default-type=module tests/dirty-tiles.test.mjs
      - name: Verify 319 progressive mobile paint governor and immutable donor cache
        run: node --experimental-default-type=module tests/render-governor.test.mjs
      - name: Verify 320 real single-canvas mark construction and exact final image
        run: node --experimental-default-type=module tests/live-painting.test.mjs
      - name: Verify 321 organic brush strokes, erasure and faithful live pigment boundaries
        run: node --experimental-default-type=module tests/organic-construction.test.mjs
      - name: Verify 322 actually computed brush-by-brush painting and cancel parity
        run: node --experimental-default-type=module tests/live-rule-execution.test.mjs
      - name: Verify 323 autonomous regional KEEP/REWORK and identity-safe local taste memory
        run: node --experimental-default-type=module tests/regional-judgement.test.mjs
      - name: Verify 324 composition negotiation and precise single-region pixel protection
        run: node --experimental-default-type=module tests/composition-negotiation.test.mjs
      - name: Verify 325 living visual roots, real-pixel form carriers and gradual pigment adaptation
        run: node --experimental-default-type=module tests/living-identity.test.mjs
      - name: Verify 326 selective forgetting and real accepted-form rediscovery under local artistic judgement
        run: node --experimental-default-type=module tests/creative-forgetting.test.mjs

      - name: Guard global renderer non-redundancy and evolving-seed genealogy
        run: node --experimental-default-type=module tests/global-nonredundancy.test.mjs
      - name: Verify component-level font anatomy and mutable logo geometry
        run: node --experimental-default-type=module tests/studio-anatomy.test.mjs
      - name: Measure dual golden-ratio art taste and animate real creative process
        run: node --experimental-default-type=module tests/golden-creative-process.test.mjs
      - name: Test carried canvas fragments
        run: node --experimental-default-type=module tests/motif-memory.test.mjs
      - name: Verify geometric idea inheritance and W-phi-H negotiation
        run: node --experimental-default-type=module tests/structural-heritage.test.mjs
      - name: Test continuous renderer fusion and recursive abstraction
        run: node --experimental-default-type=module tests/studio-abstraction-loop.test.mjs
      - name: Visual novelty and painting comparison
        run: node --experimental-default-type=module tests/studio-vision.test.mjs
